# Blocs d'influence — liens FORMELS uniquement (traités, adhésions), par niveau. Curé à la main.
# Les satellites ne sont pas déclarés ici : network.influence() les déduit des arêtes de network.yaml.
#
# level : 3 = défense mutuelle · 2 = partenariat stratégique formalisé, sans défense mutuelle
#         1 = candidature / participation gelée · 0 = intégration sans effet sur l'alignement (affiché seulement)
# entity : acteur de network.yaml auquel le groupe est rattaché comme « niveau » (ex. EU)
# since : date de création du groupe si elle tombe dans la période couverte (2014 →)
# joined / left : {ISO2: AAAA-MM} — adhésions et départs datés depuis 2014 ; un membre sans date l'était déjà en 2014.
#   left liste d'ANCIENS membres (absents de members). Chaque date doit être couverte par une source du groupe.
# members : codes ISO2 (« NO » entre guillemets, sinon YAML le lit comme « faux »). Le Kosovo (sans code ISO officiel) n'est pas représenté.

blocs:
  west:
    name: Bloc occidental
    color: "#2b6cb0"
  axis:
    name: Axe Russie–Chine–Iran–Corée du Nord
    color: "#c0392b"

