name: site

# Construit site/ à partir du dépôt et le publie sur GitHub Pages.
# Les commits de données faits par le workflow « market odds » ne déclenchent pas `push`
# (jeton GITHUB_TOKEN), d'où le déclencheur workflow_run.
on:
  push:
    branches: [main]
    paths: [network.yaml, alignments.yaml, network.py, build.py, method.py, track.py, history.py, db.py, config.py, "data/**"]
  workflow_run:
    workflows: ["market odds"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Rien n'est publié tant que le dépôt est privé
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml python-dotenv
      - run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
