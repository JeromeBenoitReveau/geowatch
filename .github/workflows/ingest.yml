name: data refresh

# Le 1er du mois : profils pays Banque mondiale + Wikidata, votes à l'ONU, coordonnées et photos → data/.
# (Les cotes des marchés de prédiction ne sont plus relevées depuis le 2026-09-29 : site d'information, sans pronostic.)
on:
  schedule:
    - cron: "40 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx pyyaml python-dotenv
      - name: Relevé
        run: python ingest.py
      - name: Commit des nouvelles données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "data: country profiles $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
