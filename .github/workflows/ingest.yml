name: market odds

# Relève les cotes Polymarket/Kalshi toutes les 6 h et commite l'historique dans data/.
on:
  schedule:
    - cron: "17 */6 * * *"   # minute décalée : les créneaux pile sont les plus retardés par GitHub
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-odds
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx pyyaml python-dotenv
      - run: python ingest.py
      - name: Commit des nouveaux relevés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "data: market odds $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
