name: market odds

# Toutes les 6 h : cotes Polymarket/Kalshi → data/odds.csv.
# Le 1er du mois : profils pays Banque mondiale + Wikidata → data/profiles.json.
on:
  schedule:
    - cron: "17 */6 * * *"   # minute décalée : les créneaux pile sont les plus retardés par GitHub
    - cron: "40 3 1 * *"
  workflow_dispatch:
    inputs:
      profiles:
        description: "Rafraîchir les profils pays au lieu des cotes"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: market-odds
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx pyyaml python-dotenv
      - name: Relevé
        run: |
          if [ "${{ github.event.schedule }}" = "40 3 1 * *" ] || [ "${{ inputs.profiles }}" = "true" ]; then
            python ingest.py --profiles; echo "WHAT=country profiles" >> "$GITHUB_ENV"
          else
            python ingest.py; echo "WHAT=market odds" >> "$GITHUB_ENV"
          fi
      - name: Commit des nouvelles données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "data: $WHAT $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
