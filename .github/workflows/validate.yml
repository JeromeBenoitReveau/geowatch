name: validate network

on:
  push:
    paths: [network.yaml, validate.py, config.py, network.py]
  pull_request:
    paths: [network.yaml, validate.py, config.py, network.py]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python validate.py
