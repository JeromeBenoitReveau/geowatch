# Leviers d'influence (dépendances mesurées) : la part d'une ressource qu'un pays (from) tire d'un fournisseur (supplier ; pas « on », que YAML lit comme « vrai »).
# Une part chiffrée et sourcée, jamais une note d'importance ; hors calcul des blocs, comme les tensions et les médiations.
# type : arms (importations d'armes majeures, SIPRI), gas, oil, minerals et food (avec resource : « terres rares », « blé ») ;
#        debt (part d'un créancier dans la dette extérieure publique, Banque mondiale IDS),
#        trade (+ direction : exports = part de ses exportations vendues au partenaire, imports = part de ses importations ;
#        WITS, seuil 20 %, sans la Russie — données 2021 — ni les paires internes à l'UE). Une part calculée à partir de volumes publiés le dit dans sa note.
# share : pourcentage ; year : fin de la période (period) ; seules les parts ≥ 10 % sont retenues.
